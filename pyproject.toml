[project]
name = "aaagent"
version = "0.1.0"
description = "A pluggable IM + LLM agent framework"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "openai>=1.30",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
aaagent = "aaagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent"]
