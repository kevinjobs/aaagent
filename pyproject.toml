[project]
name = "aaagent"
version = "0.2.0"
description = "A pluggable IM + LLM agent framework"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "openai>=1.30",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "websockets>=12",
    "aiofiles>=23.2",
]

[project.scripts]
aaagent = "aaagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
