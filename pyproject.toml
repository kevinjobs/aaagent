[project]
name = "aaagent"
version = "0.3.1"
description = "A pluggable IM + LLM agent framework"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
    "aiofiles>=23.2",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "fastmcp>=2",
]

[project.scripts]
aaagent = "aaagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent"]

[tool.uv.workspace]
members = [
    "plugins/aaagent-plugin-openai",
    "plugins/aaagent-plugin-filetools",
    "plugins/aaagent-plugin-shelltools",
    "plugins/aaagent-plugin-memorytools",
    "plugins/aaagent-plugin-mcp",
    "plugins/aaagent-plugin-skills",
    "plugins/aaagent-plugin-scheduler",
    "plugins/aaagent-plugin-sqlitesession",
    "plugins/aaagent-plugin-cliadapter",
    "plugins/aaagent-plugin-feishu",
    "plugins/aaagent-plugin-inmemorysession",
    "plugins/aaagent-plugin-markdownstore",
    "plugins/aaagent-plugin-websearch",
    "plugins/aaagent-plugin-webscrape",
]

[tool.uv.sources]
aaagent = { workspace = true }
aaagent-plugin-openai = { workspace = true }
aaagent-plugin-filetools = { workspace = true }
aaagent-plugin-shelltools = { workspace = true }
aaagent-plugin-memorytools = { workspace = true }
aaagent-plugin-mcp = { workspace = true }
aaagent-plugin-skills = { workspace = true }
aaagent-plugin-scheduler = { workspace = true }
aaagent-plugin-sqlitesession = { workspace = true }
aaagent-plugin-cliadapter = { workspace = true }
aaagent-plugin-feishu = { workspace = true }
aaagent-plugin-inmemorysession = { workspace = true }
aaagent-plugin-markdownstore = { workspace = true }
aaagent-plugin-websearch = { workspace = true }
aaagent-plugin-webscrape = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true