[project]
name = "aaagent-plugin-cliadapter"
version = "0.1.0"
description = "CLI chat adapter plugin for aaagent"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "rich>=13.0",
]

[project.entry-points."aaagent.adapters"]
cli = "aaagent_plugin_cliadapter:CliAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_cliadapter"]

[tool.uv.sources]
aaagent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
