[project]
name = "aaagent-plugin-mcp"
version = "0.1.0"
description = "MCP (Model Context Protocol) tool plugin for aaagent"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "mcp>=1.2",
]

[project.entry-points."aaagent.tools"]
mcp = "aaagent_plugin_mcp:McpToolsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_mcp"]

[tool.uv.sources]
aaagent = { workspace = true }
[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
