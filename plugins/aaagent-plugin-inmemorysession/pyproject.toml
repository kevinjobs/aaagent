[project]
name = "aaagent-plugin-inmemorysession"
version = "0.1.0"
description = "In-memory session store plugin for aaagent"
requires-python = ">=3.11"
dependencies = ["aaagent"]

[project.entry-points."aaagent.sessions"]
inmemory = "aaagent_plugin_inmemorysession:InMemorySessionFactory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_inmemorysession"]

[tool.uv.sources]
aaagent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
