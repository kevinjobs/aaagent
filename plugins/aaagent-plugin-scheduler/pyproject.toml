[project]
name = "aaagent-plugin-scheduler"
version = "0.1.0"
description = "cron-style scheduled task plugin for aaagent"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "croniter>=2.0",
]

[project.entry-points."aaagent.tools"]
scheduler = "aaagent_plugin_scheduler:SchedulerToolsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_scheduler"]

[tool.uv.sources]
aaagent = { workspace = true }