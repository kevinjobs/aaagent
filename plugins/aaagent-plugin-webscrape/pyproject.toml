[project]
name = "aaagent-plugin-webscrape"
version = "0.1.0"
description = "Web fetch / scrape tool plugin for aaagent (httpx + trafilatura)"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "httpx>=0.27",
    "trafilatura>=1.6",
]

[project.entry-points."aaagent.tools"]
webscrape = "aaagent_plugin_webscrape:WebScrapeToolsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_webscrape"]

[tool.uv.sources]
aaagent = { workspace = true }
[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
