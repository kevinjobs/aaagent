[project]
name = "aaagent-plugin-skills"
version = "0.1.0"
description = "skill management tool plugin for aaagent"
requires-python = ">=3.11"
dependencies = ["aaagent"]

[project.entry-points."aaagent.tools"]
skills = "aaagent_plugin_skills:SkillsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_skills"]

[tool.uv.sources]
aaagent = { workspace = true }
[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
