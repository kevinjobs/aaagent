[project]
name = "aaagent-plugin-sqlitesession"
version = "0.1.0"
description = "SQLite-backed dual-write session store and history search tools for aaagent"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "aiosqlite>=0.19",
]

[project.entry-points."aaagent.sessions"]
dual_write = "aaagent_plugin_sqlitesession:DualWriteSessionFactory"
sqlite = "aaagent_plugin_sqlitesession:SqliteSessionFactory"

[project.entry-points."aaagent.tools"]
sqlite_session = "aaagent_plugin_sqlitesession:SqliteSessionToolsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_sqlitesession"]

[tool.uv.sources]
aaagent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
