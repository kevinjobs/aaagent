[project]
name = "aaagent-plugin-memorytools"
version = "0.1.0"
description = "remember / recall tool plugin for aaagent"
requires-python = ">=3.11"
dependencies = ["aaagent"]

[project.entry-points."aaagent.tools"]
memory = "aaagent_plugin_memorytools:MemoryToolsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_memorytools"]