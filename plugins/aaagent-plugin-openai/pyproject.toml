[project]
name = "aaagent-plugin-openai"
version = "0.1.0"
description = "OpenAI-compatible LLM provider plugin for aaagent"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "openai>=1.30",
]

[project.entry-points."aaagent.providers"]
openai_compatible = "aaagent_plugin_openai:OpenAICompatibleProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_openai"]

[tool.uv.sources]
aaagent = { workspace = true }
[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
