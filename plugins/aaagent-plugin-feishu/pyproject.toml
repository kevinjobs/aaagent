[project]
name = "aaagent-plugin-feishu"
version = "0.1.0"
description = "Feishu WebSocket adapter plugin for aaagent"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "httpx>=0.27",
    "websockets>=12",
]

[project.entry-points."aaagent.adapters"]
feishu = "aaagent_plugin_feishu:FeishuAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_feishu"]