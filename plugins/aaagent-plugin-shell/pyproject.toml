[project]
name = "aaagent-plugin-shell"
version = "0.1.0"
description = "Slash-command bundle for aaagent: /model, /compact, /session, /sessions"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
]

[project.entry-points."aaagent.commands"]
shell = "aaagent_plugin_shell:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_shell"]
[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
