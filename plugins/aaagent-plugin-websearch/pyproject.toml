[project]
name = "aaagent-plugin-websearch"
version = "0.1.0"
description = "Web search tool plugin for aaagent (Tavily backend)"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "httpx>=0.27",
]

[project.entry-points."aaagent.tools"]
websearch = "aaagent_plugin_websearch:WebSearchToolsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_websearch"]

[tool.uv.sources]
aaagent = { workspace = true }
[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
