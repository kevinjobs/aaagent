[project]
name = "aaagent-plugin-web"
version = "0.1.0"
description = "Browser-based chat surface for aaagent, styled after DeepSeek Harness. Adds the `aaagent web` CLI command."
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "PyYAML>=6.0",
]

[project.entry-points."aaagent.adapters"]
web = "aaagent_plugin_web.adapter:WebAdapter"

[project.entry-points."aaagent.cli_commands"]
web = "aaagent_plugin_web:register_cli_command"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_web"]
# Bundle the built frontend (`web/dist/`) into the wheel so end users
# don't need npm installed to use `aaagent web`. The dist/ directory
# is optional; if it doesn't exist at build time the plugin still
# works (it serves a fallback page that explains how to build).
include = [
    "src/aaagent_plugin_web",
    "web/index.html",
    "web/dist/**/*",
]

[tool.uv.sources]
aaagent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",  # used by FastAPI TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
