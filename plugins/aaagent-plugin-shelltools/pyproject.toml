[project]
name = "aaagent-plugin-shelltools"
version = "0.1.0"
description = "Shell execution tool plugin for aaagent"
requires-python = ">=3.11"
dependencies = ["aaagent"]

[project.entry-points."aaagent.tools"]
shell = "aaagent_plugin_shelltools:ShellToolsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_shelltools"]

[tool.uv.sources]
aaagent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"
