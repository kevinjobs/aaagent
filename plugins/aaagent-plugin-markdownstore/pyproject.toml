[project]
name = "aaagent-plugin-markdownstore"
version = "0.1.0"
description = "Markdown-file backed memory store plugin for aaagent"
requires-python = ">=3.11"
dependencies = [
    "aaagent",
    "aiofiles>=23.2",
]

[project.entry-points."aaagent.memories"]
markdown = "aaagent_plugin_markdownstore:MarkdownMemoryStoreFactory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaagent_plugin_markdownstore"]

[tool.uv.sources]
aaagent = { workspace = true }
